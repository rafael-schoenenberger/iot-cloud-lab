version: "3.9"

services:
  renode:
    image: renode:latest
    volumes:
      - ../renode/boards:/workspace/boards
      - ../renode/scripts:/workspace/scripts
    ports:
      - "3333:3333"
    command: ["renode", "/workspace/scripts/stm32f4.resc"]

  firmware:
    image: firmware:latest
    volumes:
      - ../firmware/build:/workspace/build
    depends_on:
      - renode
    command: >
      arm-none-eabi-gdb /workspace/build/firmware.elf
      -ex "target remote renode:3333"
      -ex "monitor reset halt"
      -ex "load"
      -ex "continue"

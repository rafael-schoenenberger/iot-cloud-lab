services:
  firmware-build:
    build:
      context: ../firmware
      dockerfile: Dockerfile.sources
    image: firmware:latest
    volumes:
      - ../firmware/src:/workspace/src
      - ../firmware/vendor:/workspace/vendor
      - ../firmware/build:/workspace/build
    command: >
      sh -c "cmake -S /workspace/src -B /workspace/build -G Ninja &&
      ninja -C /workspace/build"

  docs:
    profiles: ["docs"]
    build:
      context: ../firmware
      dockerfile: Dockerfile.sources
    image: firmware:latest
    volumes:
      - ../firmware/src:/workspace/src
      - ../firmware/unit_tests:/workspace/unit_tests
      - ../firmware/Doxyfile:/workspace/Doxyfile
      - ../firmware/build:/workspace/build
    command: doxygen Doxyfile

  lint:
    profiles: ["lint"]
    build:
      context: ../firmware
      dockerfile: Dockerfile.sources
    image: firmware:latest
    volumes:
      - ../firmware/src:/workspace/src
      - ../firmware/vendor:/workspace/vendor
      - ../firmware/build:/workspace/build
    command: >
      bash -c "set -o pipefail; cppcheck
      --enable=warning,style,performance,portability --std=c11
      --inline-suppr --suppress=missingIncludeSystem
      --suppress=comparePointers:*/cmsis_gcc.h
      -DSTM32F407xx -DUSE_HAL_DRIVER -D__GNUC__
      -I src -I src/peripherals -I src/modem -I src/sensor
      -I vendor/stm32f4xx_hal_driver/Inc
      -I vendor/cmsis_device_f4/Include
      -I vendor/cmsis_core/Core/Include
      -I vendor/freertos_kernel/include
      -I vendor/freertos_kernel/portable/GCC/ARM_CM3
      src 2>&1 | tee /workspace/build/lint.log"

  unit-test:
    profiles: ["unit-test"]
    build:
      context: ../firmware
      dockerfile: Dockerfile.sources
    image: firmware:latest
    volumes:
      - ../firmware/src:/workspace/src
      - ../firmware/unit_tests:/workspace/unit_tests
      - ../firmware/build_unit_tests:/workspace/build_unit_tests
      - ../firmware/build:/workspace/build
    command: >
      bash -c "set -o pipefail; { cmake -S /workspace/unit_tests -B /workspace/build_unit_tests -G Ninja &&
      ninja -C /workspace/build_unit_tests &&
      /workspace/build_unit_tests/test_modem; } 2>&1 | tee /workspace/build/test.log"

  renode:
    build:
      context: ../renode
      dockerfile: Dockerfile.renode
    image: renode:latest
    volumes:
      - ../renode/boards:/workspace/boards
      - ../renode/scripts:/workspace/scripts
      - ../firmware/build:/workspace/build
    ports:
      - "3333:3333"
      - "9002:9002"
      - "9005:9005"
      - "9006:9006"
    depends_on:
      firmware-build:
        condition: service_completed_successfully
    command: ["renode", "--disable-xwt", "-P", "9005", "/workspace/scripts/stm32f4.resc"]

  temp-sim:
    build:
      context: ../temp-sim
      dockerfile: Dockerfile.temp-sim
    image: temp-sim:latest
    volumes:
      - ../temp-sim:/workspace
    depends_on:
      - renode

  modem-sim:
    build:
      context: ../modem-sim
      dockerfile: Dockerfile.modem-sim
    image: modem-sim:latest
    volumes:
      - ../modem-sim:/workspace
    depends_on:
      - renode
